name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run qa
        env:
          CI: true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa
          path: |
            qa/
            test-results/
